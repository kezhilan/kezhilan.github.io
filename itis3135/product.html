<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Baby Elephant Store</title>
    <link rel="stylesheet" href="styles/product.css"/>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
  </head>

  <body>

    <header id="header">
      <img id="header-img" src="https://upload.wikimedia.org/wikipedia/commons/3/37/African_Bush_Elephant.jpg" alt="baby elephant mascot">

      <nav id="nav-bar">
        <a class="nav-link" href="#features">Features</a>
        <a class="nav-link" href="#video">Showcase</a>
        <a class="nav-link" href="#signup">Join</a>
      </nav>
    </header>

    <section id="features">
      <h2>Baby Elephant Features</h2>
      <p>Collect adorable elephant mascots for your collection.</p>
      <p>Each elephant has unique animations and personalities.</p>
    </section>

    <section id="video-section">
      <h2>Showcase Video</h2>
      <iframe
        id="video"
        src="https://www.youtube.com/watch?v=LpzwxDqVDtc"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </section>

    <section id="signup">
      <h2>Get Your Elephant</h2>
      <form id="form" action="https://www.freecodecamp.org/email-submit">
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          required>
        <input id="submit" type="submit" value="Sign Up">
      </form>
    </section>

  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles/default.css">
  <title>Survey Form Lab</title>
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
  <div data-include="components/header.html"></div>
  <h1 id="title">User Survey</h1>
  <p id="description">Please fill out this quick survey to help us improve!</p>

  <form id="survey-form">

    <label id="name-label" for="name">Name:</label>
    <input id="name" type="text" placeholder="Enter your name" required />
    <br />

    <label id="email-label" for="email">Email:</label>
    <input id="email" type="email" placeholder="Enter your email" required />
    <br />

    <label id="number-label" for="number">Age:</label>
    <input id="number" type="number" placeholder="Enter your age" min="10" max="99" required />
    <br />

    <label for="dropdown">Choose your favorite option:</label>
    <select id="dropdown">
      <option value="option1">Option 1</option>
      <option value="option2">Option 2</option>
    </select>
    <br />

    <p>Choose your preference:</p>
    <input type="radio" id="radio1" name="preference" value="a" />
    <label for="radio1">Option A</label><br />
    <input type="radio" id="radio2" name="preference" value="b" />
    <label for="radio2">Option B</label>
    <br />

    <p>Select your hobbies:</p>
    <input type="checkbox" id="hobby1" name="hobbies" value="sports" />
    <label for="hobby1">Sports</label><br />
    <input type="checkbox" id="hobby2" name="hobbies" value="gaming" />
    <label for="hobby2">Gaming</label><br />
    <input type="checkbox" id="hobby3" name="hobbies" value="music" />
    <label for="hobby3">Music</label>
    <br />

    <label for="comments">Additional Comments:</label>
    <textarea id="comments" name="comments" placeholder="Enter your comments here..."></textarea>
    <br />

    <button id="submit" type="submit">Submit</button>
  </form>
  <div data-include="components/footer.html"></div>
  <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>

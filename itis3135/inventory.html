<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles/inventory.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

  <h1>Book Inventory</h1>

  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Category</th>
        <th>Status</th>
        <th>Rate</th>
      </tr>
    </thead>

    <tbody>
      <tr class="read">
        <td>Flying Elaphant</td>
        <td>Dumbo</td>
        <td>Adventure</td>
        <td><span class="status">Read</span></td>
        <td>
          <span class="rate three">
            <span></span><span></span><span></span>
          </span>
        </td>
      </tr>

      <tr class="to-read">
        <td>The Trunk</td>
        <td>Ella Fant</td>
        <td>Horror</td>
        <td><span class="status">To Read</span></td>
        <td>
          <span class="rate">
            <span></span><span></span><span></span>
          </span>
        </td>
      </tr>

      <tr class="in-progress">
        <td>Poacher</td>
        <td>Wild Phant</td>
        <td>Action</td>
        <td><span class="status">In Progress</span></td>
        <td>
          <span class="rate">
            <span></span><span></span><span></span>
          </span>
        </td>
      </tr>

      <tr class="read">
        <td>Savanna</td>
        <td>African Elephant</td>
        <td>Fantasy</td>
        <td><span class="status">Read</span></td>
        <td>
          <span class="rate two">
            <span></span><span></span><span></span>
          </span>
        </td>
      </tr>
    </tbody>
  </table>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Introduction Form</title>

    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

<h2>Introduction Form</h2>
<h3>Please submit the form below.</h3>

<form id="form">

    <input id="firstName" value="Kavin" placeholder="First Name" required>
    <input id="lastName" value="Ezhilan" placeholder="Last Name" required>

    <input id="mascotAdj" value="Estatic" placeholder="Mascot Adjective" required>
    <input id="mascotAnimal" value="Elephant" placeholder="Mascot Animal" required>

    <input id="personalBackground" value="I am 22 years old and I like sports, games, and computers." placeholder="Personal Background" required>
    <input id="professionalBackground" value="None" placeholder="Professional Background" required>
    <input id="academicBackground" value="UNCC Cybersecurity focus" placeholder="Academic Background" required>

    <textarea id="personalStatement" required>I am a senior at UNCC with a focus on CyberSecurity.</textarea>

    <input id="funny" value="I am a first generation American" placeholder="Funny">
    <input id="share" value="I was Born in California" placeholder="Share">

    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="button" id="clearBtn">Clear</button>
    <button type="button" id="genHTML">Generate HTML</button>
    <button type="button" id="genJSON">Generate JSON</button>

</form>

<script src="scripts/introduction.js"></script>
<script src="scripts/generate_html.js"></script>
<script src="scripts/generate_json.js"></script>

</body>
</html>
